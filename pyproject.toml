[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "base-tool"
version = "0.1.0"
description = "Base Tool — công cụ desktop chạy local (CLI + Web UI)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "pydantic>=2.6",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "playwright>=1.44", "ruff>=0.6"]

[project.scripts]
basetool = "basetool.__main__:main"
basetool-web = "web.server:main"

[tool.setuptools.packages.find]
include = ["basetool*", "web*"]

[tool.setuptools.package-data]
web = ["static/**/*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: cần tool ngoài / chạy chậm",
  "real: dùng dữ liệu thật qua BASETOOL_REAL_DATA (không bao giờ commit)",
  "ui: test trình duyệt Playwright",
]
